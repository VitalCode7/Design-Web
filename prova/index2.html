<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cor randômica</title>
</head>
<body>
    <h1>Cor randômica</h1>

    <button id="trocar">Trocar cor</button>
    <p id="cores"></p>

    <script>
        let gerar = document.getElementById("trocar")
        let LCores = document.getElementById("cores")
        let cores = []

        gerar.addEventListener("click", function (e) {
            let r = Math.floor(Math.random() * 255)
            let g = Math.floor(Math.random() * 255)
            let b = Math.floor(Math.random() * 255)

            let cor = `rgb(${r}, ${g}, ${b})`

            document.body.style.backgroundColor = cor

            cores.push(cor)
            LCores.innerHTML = cores.toString()
        })
    </script>
</body>
</html>
