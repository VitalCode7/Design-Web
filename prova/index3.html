<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cores randômicas</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h1>Cores randômicas</h1>

    <button id="trocar">Gerar quadrados</button>
    <p id="cores"></p>

    <script>
        let gerar = document.getElementById("trocar")
        let LCores = document.getElementById("cores")

        gerar.addEventListener("click", function () {

            for (let i = 0; i < 20; i++) {
                let r = Math.floor(Math.random() * 255)
                let g = Math.floor(Math.random() * 255)
                let b = Math.floor(Math.random() * 255)

                let cor = `rgb(${r}, ${g}, ${b})`

                LCores.innerHTML +=
                    `<span style="background-color: ${cor}"></span>`
            }
        })
    </script>
</body>
</html>
