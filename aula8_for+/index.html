<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estruturas de Repetição</title>
</head>
<body>
    <h1>ESTRUTURAS DE REPETIÇÃO</h1>
    <p id="texto"></p>
    <ol id="listadealunos"></ol>
    <script>
        const alunos = ['Carlos', 'Alcides', 'bianca', 'Danúbia'];
        //variavel de lista de alunos
        document.getElementById("texto").innerHTML = alunos.sort().join(" , ");
        // imprimir chamando 2 metodos para lista: sort que é para ordenar e join (insere um caractere entre) 
        
        //for
        for(let i=0 ; i<10 ; i++){
            //A estrutura de repetoção 'for' recebe 3 parametros:
            //1° parametro: declaração/início
            //2° parametro: teste lógico
            //3º parametro: incremento
            //++i é igual ao i+=1 ou i++
            console.log(i);
        }

        for(let i=0 ; i>10 ; i+=2){
            console.log("incremento de 2 em 2: "+i+"\n");
            // \n é tipo um br para console log
            // '+' concatena a string (valor estático) com a variavel
        }
        for(let i=10 ; i>0 ; i--){
            console.log("Decremento: "+i);
        }
        //forEach
        alunos.forEach(item => {
            
            //forEach é uma opção prática para imprimir os valores de uma lista
            //não ´enecessário incrementar e nem fazer teste lógico com o comprimento da lista
            //'item' é uma variável criada internamente para representar cada item da lista
            console.log(item)
    })
    for(let i=0 ; i<3 ; i++){
        console.log(alunos[i]);
        document.getElementById("listadealunos").innerHTML += "<li>"+alunos[i]+"</li>";
        document.getElementById("listadealunos").innerHTML += `<li>${alunos[i]}+"</li>"`;
        //2 possibilidade de mostrar o valor
        // '+=' pega o valor já impresso e coloca um novo
    }
    //while
    let i=0;
    while(i<10){
        console.log(i);
        i++; //não esquecer do incremento, caso contrário, TRAVA TUDO!
    }

    </script>
    
</body>
</html>
